# Render Blueprint for FIAP LSTM API
services:
  - type: web
    name: fiap-lstm-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: MODEL_PATH
        value: "./outputs/model_export/"
      - key: PREDICTIONS_PATH
        value: "./outputs/predictions.csv"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_RETENTION_DAYS
        value: "30"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
    healthCheckPath: /health
    plan: free  # Change to 'starter' or 'standard' for production
    region: oregon  # Choose: oregon, ohio, frankfurt, singapore
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile.render
